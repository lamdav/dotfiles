# Safe operations policy — auto-approved, no scrutiny needed.
# Covers read-only ops, reversible local changes, and standard
# infra/Go/Python/Docker tooling for personal dev workflows.
#
# Mutations that affect remote state or cluster state (git push,
# kubectl apply/delete, helm upgrade, docker run) are intentionally
# absent — those fall through to default approval prompts.

# ── File system reads ────────────────────────────────────────────

[[rule]]
toolName = "read_file"
decision = "allow"
priority = 100

[[rule]]
toolName = "glob"
decision = "allow"
priority = 100

[[rule]]
toolName = "search_text"
decision = "allow"
priority = 100

[[rule]]
toolName = "list_directory"
decision = "allow"
priority = 100

# ── Web fetch ────────────────────────────────────────────────────

[[rule]]
toolName = "web_fetch"
commandRegex = "^https://(github\\.com|raw\\.githubusercontent\\.com|pkg\\.go\\.dev|docs\\.python\\.org|docs\\.docker\\.com)"
decision = "allow"
priority = 100

# ── Git — permissive, reflog recovers most mistakes ─────────────

[[rule]]
toolName = "run_shell_command"
commandRegex = "^git (log|diff|status|show|branch|stash|add|commit|checkout|switch|restore|fetch|pull|merge|rebase|reset|tag|cherry-pick)"
decision = "allow"
priority = 100

# ── Go ───────────────────────────────────────────────────────────

[[rule]]
toolName = "run_shell_command"
commandRegex = "^go (build|test|run|mod|get|vet|fmt|work)"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "gofmt"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = "golangci-lint"
decision = "allow"
priority = 100

# ── Python — test runners and deps only, not arbitrary execution ─

[[rule]]
toolName = "run_shell_command"
commandRegex = "^(pytest|python3 -m pytest)"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandRegex = "^uv (sync|pip|run pytest)"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandRegex = "^pip (install|list|show|freeze)"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandRegex = "^(ruff|mypy|black|isort)"
decision = "allow"
priority = 100

# ── Docker — read + build/pull, not run/stop/rm ──────────────────

[[rule]]
toolName = "run_shell_command"
commandRegex = "^docker (ps|images|logs|inspect|stats|build|pull)"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandRegex = "^docker compose (ps|logs|build)"
decision = "allow"
priority = 100

# ── Bazel ────────────────────────────────────────────────────────

[[rule]]
toolName = "run_shell_command"
commandRegex = "^bazel (build|test|query|info|run|clean)"
decision = "allow"
priority = 100

# ── kubectl — read only ──────────────────────────────────────────

[[rule]]
toolName = "run_shell_command"
commandRegex = "^kubectl (get|describe|logs|top|explain)"
decision = "allow"
priority = 100

# ── helm — read only ─────────────────────────────────────────────

[[rule]]
toolName = "run_shell_command"
commandRegex = "^helm (list|status|get|history)"
decision = "allow"
priority = 100
