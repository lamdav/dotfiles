repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.patch$
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$
        # zsh files use zsh-specific syntax not understood by shellcheck
        exclude: \.zsh$

  # black, isort, and detect-secrets run via `uv run` against the project's
  # own dev dependencies instead of pre-commit's separately pinned mirror
  # repos — pyproject.toml/uv.lock is the single source of truth for their
  # versions. shellcheck and the hooks above have no project-dependency
  # equivalent, so their `rev:` here is still their legitimate version SOT.
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
      - id: detect-secrets
        name: Detect secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
