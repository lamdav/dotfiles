[tools]
node    = "lts"      # LTS for stability
python  = "latest"
go      = "latest"
java    = "temurin-21"  # LTS, replaces jabba

# Isolated Python CLI tools (replaces pipx — see brew/Brewfile.devtools)
"pypi:pre-commit" = "latest"
"pypi:poetry"     = "latest"
"pypi:commitizen" = "latest"

[settings]
experimental = false
jobs         = 4         # parallel installs
verbose      = false
yes          = false     # don't auto-confirm destructive actions
